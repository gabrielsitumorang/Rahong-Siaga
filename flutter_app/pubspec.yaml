name: flood_warning_rahong
description: "Sistem Peringatan Dini Banjir Desa Rahong Berbasis Flutter Dart & Fuzzy Logic"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1

  # Networking & REST API
  http: ^1.2.0

  # GIS & Interactive Map (OpenStreetMap & Tile Layers, works out of the box without Google Billing)
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Location & Geofencing
  geolocator: ^11.0.0

  # Notifications
  flutter_local_notifications: ^17.0.0

  # Firebase Cloud Messaging
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.19

  # UI Enhancements & Icons
  cupertino_icons: ^1.0.6
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/desa_rahong.geojson

